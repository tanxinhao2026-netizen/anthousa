name: build-and-publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: write
  contents: write
  issues: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  guard:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false   # the engine code being judged never sees a write token
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install shapely numpy
      - name: the gate that judges this push is the one on main before it
        run: git show ${{ github.event.before }}:.github/guard.py > /tmp/guard.py 2>/dev/null || cp .github/guard.py /tmp/guard.py
      - name: rebuild every era and run the acceptance checks
        id: check
        run: python engine/build_all.py && python engine/test_grammar_rules.py
      - name: who may change what
        id: gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: python /tmp/guard.py
      - name: rejected → restore main's previous tree and say why
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f /tmp/guard_reason ] || echo "engine/check.py or the tests failed on the rebuilt world" > /tmp/guard_reason
          git config user.name "anthousa-guard"; git config user.email "guard@users.noreply.github.com"
          # works across merge commits too: put back exactly the tree main had before this push
          git read-tree -u --reset ${{ github.event.before }}
          git commit -m "guard: restore main to ${{ github.event.before }} (rejected push ${GITHUB_SHA::7})"
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          gh issue create -R "$GITHUB_REPOSITORY" --title "守卫回滚 · guard reverted ${GITHUB_SHA::7}" --body "$(printf '这次推送被机器守卫拒绝并已回滚。\n\n%s\n\n运行记录：%s/%s/actions/runs/%s' "$(cat /tmp/guard_reason)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          gh workflow run build-and-publish --ref main -R "$GITHUB_REPOSITORY"
  build:
    needs: guard
    if: always() && (needs.guard.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install shapely numpy
      - run: python engine/build_all.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
